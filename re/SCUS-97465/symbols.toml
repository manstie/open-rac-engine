# 2026-10-15, Deadlocked's movement against UYA's for the hero kit's per-game profiles
# (PLAN.md RE.3, P1.5; docs/research/hero-controller.md, "Differences between the games").
# Checked against the traces dlntsc-dreadzone-moves-{1..7}.

[[symbol]]
name = "hero_update_walk"
address = 0x00695CB8
kind = "function"
confidence = "medium"
note = "State 2's motion, UYA's walk with its literals × frame_dt: 37 u/s² up, 30 down, 17 skidding, the skid limits (1.7 u/s, 120°, 110° in 6 frames, 70°, 4°), the part-pushed stick (0.75, 35°, 0.4; 0.9, 45°) and the 54 u/s² ground push. The release skid depends on the hand slot."

[[symbol]]
name = "hero_update_jump"
address = 0x00696620
kind = "function"
confidence = "medium"
note = "The motion of every jump-type state: push-off towards the air speed (20 and 11 u/s²) with the 0.015/0.2/15.0098 rad/s turn, the run jump's and long jump's forward pushes, then hero_air_horizontal; the apex gravity switch after frame 17."

[[symbol]]
name = "hero_air_horizontal"
address = 0x00680A88
kind = "function"
confidence = "medium"
note = "Air control (UYA 0x4EDE80): 20 u/s² towards air speed × stick, braking at 8 (2 when blocked, 11 on a flag) when that is under 0.2 × walk_speed; the wall jump's turn and 4.9 u/s, the ledge jump's forward speed, the flip's 0.04/0.2/6.98 rad/s turn."

[[symbol]]
name = "hero_walk_turn"
address = 0x0067D100
kind = "function"
confidence = "medium"
note = "The walk's facing spring: setting off clamp(0.02 m, 0.01, 0.022), damping 0.27, cap clamp(3.84 m, 1.92, 5.585) rad/s; skidding 0.035 and 11.69 rad/s. Another set for a gun mode (0.017/0.18/8.73 rad/s at full stick)."

[[symbol]]
name = "hero_turn_spring"
address = 0x0067CFD0
kind = "function"
confidence = "medium"
note = "Turns the facing on a spring (game_spring_rate), storing the rate at hero+0x17A4 and the error at +0x17A8. With a camera other than third person and a gun out, the gain is at least 0.2 and the cap at least 52.36 rad/s."

[[symbol]]
name = "hero_walk_stick_target"
address = 0x0067CAF8
kind = "function"
confidence = "medium"
note = "The walk's and fall's speed target: walk_speed × frame_dt × stick magnitude × hero+0x2FC0 (libdl's Speed, 1.0 here); wading (114) × 0.8, at least 2.5 u/s × frame_dt, as UYA's."

[[symbol]]
name = "walk_speed"
address = 0x003B01A0
kind = "data"
confidence = "high"
note = "7.25 (u/s), UYA's walk_speed counterpart. Verified: the walk reaches 0.120833 u a frame in the moves traces."

[[symbol]]
name = "heli_thrust_table"
address = 0x002207D0
kind = "data"
confidence = "medium"
note = "The heli jump's thrust segments, 16 bytes each {u/s², slope, frames, -}: 49 u/s² for 1000 frames, applied from frame 35 (34 under a flag) to 70, as UYA's."

[[symbol]]
name = "hero_walk_jump"
address = 0x00687430
kind = "function"
confidence = "medium"
note = "The walk's jump press (UYA hero_walk_jump 0x502368): it reads the strafe flag, the camera and the gun as UYA's flip check does, then ignores them and starts a standing jump (state 7). Verified: strafing sideways or back with X jumps (moves-2)."

[[symbol]]
name = "pad_pressed_within"
address = 0x005BD868
kind = "function"
confidence = "medium"
note = "(bits, frames, out, pad): true when one of the pad bits was pressed within the last `frames` frames; the jump buffers and the double jump's window use it."

[[symbol]]
name = "camera_option"
address = 0x001711D0
kind = "data"
confidence = "high"
note = "A word per local player: the camera option that control_scheme and the hero's CameraType follow. Writing 0 switched the running game to third person (dlntsc-dreadzone-third.p2s)."

[[symbol]]
name = "hero_camera_type_update"
address = 0x0068BBA0
kind = "function"
confidence = "medium"
note = "Copies camera_option into control_scheme and sets hero+0x1AE0, the camera type, from it; L2 in lock-strafe switches to first person (state 29)."

