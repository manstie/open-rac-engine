# Ratchet: Deadlocked (NTSC-U, SCUS-97465): named addresses. Format: re/README.md.
# Found 2026-10-12 by static analysis in Ghidra of a savestate taken headlessly
# (docs/re-setup.md, "NTSC savestates without a capture session"), by matching each item to
# its Gladiator PAL counterpart (PLAN.md RE.2, RE.3, RE.8).

release = "SCUS-97465"
image = "DreadZone Station, a new game just after the intro (headless boot, 2026-10-12)"
notes = """
Code addresses are inside DreadZone Station's level overlay, so they only hold for this
level. $gp is 0x22597F. No trace has been recorded on this release yet, so nothing here is
checked against the running game: confidence is at most medium.
"""

[[symbol]]
name = "hero_change_state"
address = 0x00699C70
kind = "function"
confidence = "medium"
note = "Counterpart of Gladiator PAL's. Same per-second constants; frame counts scaled by about 6/5 (standing-jump hold 17 frames against 14)."

[[symbol]]
name = "hero_jump_vertical"
address = 0x006804C8
kind = "function"
confidence = "medium"
note = "Counterpart of Gladiator PAL's; the double jump runs for 8 frames against 7."

[[symbol]]
name = "hero_player_constants"
address = 0x003BD930
kind = "data"
confidence = "medium"
note = "HeroPlayerConstants, pointed to by hero+0x2EEC. Every value is identical to Gladiator PAL's."

[[symbol]]
name = "frame_rate_ratio"
address = 0x0021DDF0
kind = "data"
confidence = "medium"
note = "1.0 on this NTSC build (0.8333 on Gladiator PAL)."

[[symbol]]
name = "frame_dt"
address = 0x0021DDF4
kind = "data"
confidence = "medium"
note = "Seconds per frame, 1/60."

[[symbol]]
name = "frame_dt2"
address = 0x0021DDF8
kind = "data"
confidence = "medium"
note = "frame_dt squared, 1/3600."

[[symbol]]
name = "frame_dt3"
address = 0x0021DDFC
kind = "data"
confidence = "low"
note = "frame_dt cubed. Uses not yet seen."

# 2026-10-12, the charge boots (PLAN.md RE.3). DL dispatches the hero's states through three
# tables of 154 code pointers indexed by the state number.

[[symbol]]
name = "hero_state_enter_table"
address = 0x003B0BE0
kind = "data"
confidence = "medium"
note = "Jump table of hero_change_state's switch: the per-state setup on entering a state."

[[symbol]]
name = "hero_state_update_table"
address = 0x003B08C0
kind = "data"
confidence = "medium"
note = "Jump table of hero_update_state's switch: each state's per-frame motion."

[[symbol]]
name = "hero_state_transition_table"
address = 0x003B0E50
kind = "data"
confidence = "medium"
note = "Jump table of hero_transitions's switch: each state's ways out."

[[symbol]]
name = "hero_update_state"
address = 0x00690F18
kind = "function"
confidence = "medium"
note = "Per-frame motion of the current state. State 125 (charge) sets the speed target, steering and ground-hugging spring."

[[symbol]]
name = "hero_transitions"
address = 0x0069EA40
kind = "function"
confidence = "medium"
note = "Per-state transitions. Calls hero_common_transitions first."

[[symbol]]
name = "hero_common_transitions"
address = 0x006A5248
kind = "function"
confidence = "medium"
note = "Transitions shared by the ground states, including the charge's start: a second R1 press in the 15-frame window, with gadget 0x11 owned."

[[symbol]]
name = "hero_update_idle"
address = 0x00695570
kind = "function"
confidence = "medium"
note = "Idle-type update shared by states 0, 1, 3, 4 and others: braking 27 u/s² in the skid state (3) and the crouch, 17.7 otherwise."

[[symbol]]
name = "hero_update_timers"
address = 0x00684EF0
kind = "function"
confidence = "medium"
note = "Counts down the hero's frame timers, among them the charge cooldown at hero+0x2E54."

[[symbol]]
name = "hero_stick_move"
address = 0x0067C5F8
kind = "function"
confidence = "medium"
note = "Turns the stick into a camera-relative move direction and a target speed (scale × stick length)."

[[symbol]]
name = "hero_turn_by"
address = 0x0067CBC0
kind = "function"
confidence = "medium"
note = "Adds an angle to the hero's yaw (the charge's steering), or rotates by a full matrix on magnetic ground."

[[symbol]]
name = "hero_speed_towards_target"
address = 0x0067D350
kind = "function"
confidence = "medium"
note = "Moves the speed (hero+0x1784) towards the target (hero+0x1780) by the first argument when rising, the second when falling."

[[symbol]]
name = "hero_velocity_along"
address = 0x0067D3A0
kind = "function"
confidence = "medium"
note = "Sets the intended velocity from the speed along a yaw (the facing when given more than π), following the ground's slope."

[[symbol]]
name = "charge_steer_ease"
address = 0x0066F408
kind = "function"
confidence = "medium"
note = "Eases two stored values towards minus the stick's x and y by a step a frame, clamped to ±1; the charge steers with the first."

[[symbol]]
name = "hero_wall_probe"
address = 0x006708B0
kind = "function"
confidence = "low"
note = "Ray forward from the capsule's front at a given height; true when it hits within a given distance. Cached per frame."

[[symbol]]
name = "hero_set_animation"
address = 0x00688C08
kind = "function"
confidence = "medium"
note = "Starts an animation with a blend length in frames (negative: the default). The 8.0, 11.0 and -2.0 next to state changes are blends, not physics."

[[symbol]]
name = "hero_play_sound"
address = 0x006835F0
kind = "function"
confidence = "low"
note = "Plays one of the hero's sounds by index."

[[symbol]]
name = "pad_action_mask"
address = 0x005BE808
kind = "function"
confidence = "medium"
note = "Pad bits for an action under the camera option (control_scheme): in lock-strafe (1, the default) R1 (8) and L1 (4) become L2 (1), Triangle (0x10) becomes 0x12 and X (0x40) X or L1 (0x44); in third person (0) each stays. Checked 2026-10-15: in lock-strafe L1 jumps."

[[symbol]]
name = "gadget_owned"
address = 0x006BF278
kind = "function"
confidence = "medium"
note = "Whether the gadget box (hero+0x26E4) holds a gadget id: its level byte at +0xA30 + 0x44 × id is not negative."

[[symbol]]
name = "timer_count_down"
address = 0x0055D180
kind = "function"
confidence = "medium"
note = "Counts a short timer down to 0; 2 when it just ran out."

[[symbol]]
name = "approach"
address = 0x00594AE8
kind = "function"
confidence = "medium"
note = "value += clamp(target - value, -step, step); returns the distance left."

[[symbol]]
name = "game_spring_rate"
address = 0x00594A88
kind = "function"
confidence = "medium"
note = "The games' spring: rate clamped to the error, += gain × error - damping × rate, capped, clamped again."

[[symbol]]
name = "game_spring"
address = 0x00594D28
kind = "function"
confidence = "medium"
note = "game_spring_rate then value += rate, snapping to the target within 1% of the cap."

[[symbol]]
name = "frame_rate_scale"
address = 0x0021DDEC
kind = "data"
confidence = "low"
note = "1.0 on this build; multiplies per-frame spring gains and damping."

[[symbol]]
name = "charge_mode_flag"
address = 0x0021E878
kind = "data"
confidence = "low"
note = "0 in single player. When set, the charge heads for 11.5 u/s throughout and hugs the ground with a downward push instead of the spring; probably multiplayer."

[[symbol]]
name = "hero_skid_slide"
address = 0x006834C8
kind = "function"
confidence = "medium"
note = "The skid's slide: shortens the vector at hero+0x1A0 (the motion when the skid began) by its argument each frame and adds it to the intended velocity. Checked in the DL charge traces."

[[symbol]]
name = "control_scheme"
address = 0x00171DE0
kind = "data"
confidence = "medium"
note = "One byte per local player (indexed by hero+0x2F10): the camera option, which hero+0x1AE0 (libdl's CameraType) follows: 1, the default, lock-strafe; 0 third person; 2 first person. Lock-strafe maps the crouch and charge action to L2 (pad_action_mask). It follows camera_option each frame."

# 2026-10-13, changing level (docs/re-setup.md, "Going straight to a level"), the same
# mechanism as UYA's (re/SCUS-97353/symbols.toml).

[[symbol]]
name = "level_current"
address = 0x0021DE10
kind = "data"
confidence = "high"
note = "The level being played (libdl's ACTIVE_LEVEL_ID): 1 on DreadZone Station."

[[symbol]]
name = "level_next"
address = 0x00222B80
kind = "data"
confidence = "high"
note = "The level the next change loads. Writing it, then level_change_request, loaded each planet headlessly (tools/pine-probe/warp.sh); docs/re-setup.md lists the levels."

[[symbol]]
name = "level_change_request"
address = 0x0021E80C
kind = "data"
confidence = "high"
note = "Non-zero makes main_loop call level_change."

[[symbol]]
name = "game_mode"
address = 0x0021DDB4
kind = "data"
confidence = "medium"
note = "0 in normal play, 1 during the opening cutscene, 3 on a planet's challenge menu, 6 while a level change loads; the counterpart of UYA's game_mode."

[[symbol]]
name = "main_loop"
address = 0x00528098
kind = "function"
confidence = "medium"
note = "The per-frame game loop; each frame it first checks level_change_request."

[[symbol]]
name = "request_level_change"
address = 0x005687B0
kind = "function"
confidence = "medium"
note = "(level, save, extra): sets level_next, level_change_request, the previous level, and a third value at 0x21DE7C."

[[symbol]]
name = "level_change"
address = 0x00627D18
kind = "function"
confidence = "medium"
note = "Sets level_current from level_next, tears the level down and loads the new one."

# The skins (2026-10-15): found from the table of contents' copy in memory and libdl's
# player layout, read in Ghidra on the DreadZone Station image (docs/research/moby-format.md,
# "DL's skins").

[[symbol]]
name = "toc"
address = 0x001C2040
kind = "data"
confidence = "medium"
note = "The table of contents as loaded: eight global WAD headers back to back, the fifth (skin_wad_header) the skins'."

[[symbol]]
name = "skin_wad_header"
address = 0x001C29E8
kind = "data"
confidence = "medium"
note = "The skin WAD's header: size 0x228, first sector, then {class sector, count, textures sector, count} per skin from 0x1C29F0, and texture-only files from 0x1C2B30, 0x1C2B90 and 0x1C2BD0."

[[symbol]]
name = "skin_load"
address = 0x005756D0
kind = "function"
confidence = "medium"
note = "Loads skin-table entry a0 into player slot a1 (0 or 1): sends its textures to the GS, reads its class over them and relocates it."

[[symbol]]
name = "skin_load_p1"
address = 0x00575B48
kind = "function"
confidence = "medium"
note = "skin_load into slot 0 unless that entry is already there."

[[symbol]]
name = "skin_load_p2"
address = 0x00575B88
kind = "function"
confidence = "medium"
note = "skin_load into slot 1 unless that entry is already there."

[[symbol]]
name = "skin_textures_a_load"
address = 0x00575DC0
kind = "function"
confidence = "medium"
note = "Loads texture-only file a0 of the group from 0x1C2B30 to the GS; the level load passes a number from the save (0x171BA4)."

[[symbol]]
name = "skin_textures_b_load"
address = 0x00575EA0
kind = "function"
confidence = "medium"
note = "As skin_textures_a_load for the group from 0x1C2B90; the level load picks the file by level."

[[symbol]]
name = "skin_textures_c_load"
address = 0x00575F80
kind = "function"
confidence = "medium"
note = "As skin_textures_a_load for the group from 0x1C2BD0 (three textures each); the level load picks the file by level."

[[symbol]]
name = "vendor_list"
address = 0x00631CE8
kind = "function"
confidence = "medium"
note = "Builds a vendor's list of items. With a3 set it lists skins (type 0xC): the armors by armor_skins, then the skins by skin_entries, with names from skin_names and descriptions from skin_descriptions."

[[symbol]]
name = "vendor_buy"
address = 0x00632CA0
kind = "function"
confidence = "medium"
note = "Carries out a purchase {type, value, cost}. Type 0xC is a skin: sets its bit in skins_owned, stores it as player 1's (or 2's) skin and loads it."

[[symbol]]
name = "skin_menu_choose"
address = 0x0061C238
kind = "function"
confidence = "medium"
note = "The skin menu's choice: shows the item's name and description and wears its skin-table entry in the player's slot."

[[symbol]]
name = "text_by_number"
address = 0x00570620
kind = "function"
confidence = "medium"
note = "The string for a text number: the record of text_table whose number matches, or \"Paradox ERR\"."

[[symbol]]
name = "text_table"
address = 0x00222C24
kind = "data"
confidence = "medium"
note = "Points at the loaded text records, 16 bytes each: the string's address, then its number in the low half of the next word (6,349 records on DreadZone Station)."

[[symbol]]
name = "skin_p1"
address = 0x00171B52
kind = "data"
confidence = "medium"
note = "u16: player 1's skin-table entry, kept in the save; the level load wears it."

[[symbol]]
name = "skin_p2"
