# 2026-10-13, swimming (PLAN.md RE.3).

[[symbol]]
name = "hero_enter_water"
address = 0x005010B8
kind = "function"
confidence = "medium"
note = "Called from hero_transitions: puts a hero in water into surface idle (54) when falling with his feet about 0.45 u under in water over 0.8 u deep, or more than 0.8 u under; and surfaces an underwater hero rising within 0.4 u of the top."

[[symbol]]
name = "hero_surface_float"
address = 0x00501458
kind = "function"
confidence = "medium"
note = "Sets the hero's height on the surface: a tracked surface height (spring 0.027, 0.3) less 0.12, plus a bobbing offset (0x1A5300, rate 0x1A5304)."

[[symbol]]
name = "game_spring"
address = 0x00445168
kind = "function"
confidence = "high"
note = "Scalar spring on a value and its rate: the rate is clamped to the error, gains gain × error, loses damping × rate, is capped when the cap is positive, and clamped again; snaps within 1% of the cap. The rate step is 0x445010; the angle version is 0x4455F0."

[[symbol]]
name = "hero_turn_to_move_angle"
address = 0x004EAFF8
kind = "function"
confidence = "medium"
note = "Turns the yaw towards the move angle (0x1A4D80) with the angle spring; returns the angle left in 0x1A4D88. Triples its gain and cap in one control mode."

[[symbol]]
name = "hero_stick_move_angle"
address = 0x004EAA78
kind = "function"
confidence = "medium"
note = "Sets the move angle from the camera-relative stick (the yaw when released) and the speed target to its argument × the stick's length. While strafing it also sorts the stick into strafe_direction (left 0, right 1, forward 2, back 3; 45-degree sectors either side of each, an exact diagonal counting as forward) and sets strafe_back for back with the stick past 0.15."

[[symbol]]
name = "anim_table_over_step"
address = 0x004E1368
kind = "function"
confidence = "high"
note = "(table, length): frac(frame) × table[frame] + (step − frac(frame)) × table[frame − 1], with the frame at 0x1A57F8 and last tick's step at 0x1A57FC; wraps unless bit 2 of 0x1A57E8 is set. The swim stroke uses it. Checked on every swimming frame of the sewer traces (2026-10-13)."

[[symbol]]
name = "swim_stroke_table"
address = 0x002F6630
kind = "data"
confidence = "high"
note = "30 floats: how hard each frame of the swimming stroke pushes, 0.4 rising to 1.0 on frames 8-11 and back to 0.4 by frame 23. The same values are at 0x2F37B0 in the Aquatos sewers' overlay (level 28)."

[[symbol]]
name = "hero_swim_block"
address = 0x001A5570
kind = "data"
confidence = "medium"
note = "libuya's HeroSwim: +0x10 dive time (the dive lasts 40), +0x14 bank rate, +0x18 pitch rate, +0x1C saved yaw rate, +0x24 minimum swim timer, +0x2C the surface swim's bob spring rate, +0x30 Cross and +0x32 Square hold counts."

[[symbol]]
name = "hero_water_height"
address = 0x001A4F30
kind = "data"
confidence = "medium"
note = "Written by hero_ground_probe: the water surface's height under the hero (libuya's HeroGround waterHeight). Quicksand's is at 0x1A4F34."

[[symbol]]
name = "hero_water_depth"
address = 0x001A7428
kind = "data"
confidence = "medium"
note = "Water surface less the floor's height; 0.25-0.85 sets the wading flag at 0x1A71CA."

[[symbol]]
name = "hero_anim_rate"
address = 0x001A57E0
kind = "data"
confidence = "medium"
note = "Speed of the hero's animation; it advances rate × 0x1A57E4 (0.5 in the Veldin image) frames a tick. Swimming sets it from the speed."

# 2026-10-13, swimming traced in the Aquatos sewers (docs/research/hero-controller.md,
# "Swimming"): what stops a dive, and what bends the underwater velocity.

[[symbol]]
name = "hero_no_dive_timer"
address = 0x001A4DDE
kind = "data"
confidence = "high"
note = "i16 countdown; a dive from the surface needs it at 0. hero_timers_update counts it down and on Florana (2) and Marcadia (4) sets it to 10 every frame. In the Aquatos sewers' overlay a level object (update at 0x323B68 there) sets it to 2 every frame while the hero is in its volume and outside its two exception volumes; in a new game's sewers that is everywhere."

[[symbol]]
name = "hero_timers_update"
address = 0x004FAA68
kind = "function"
confidence = "medium"
note = "Per-frame bookkeeping: increments the state timer at 0x1A4D98 and counts down the hero's i16 timers at 0x1A4DB0-0x1A4DFC, among them the no-grab timer (0x1A4DB0), the wall window (0x1A4DB4) and hero_no_dive_timer, which it holds at 10 on levels 2 and 4."

[[symbol]]
name = "hero_wall_slide"
address = 0x004EB5D0
kind = "function"
confidence = "high"
note = "(force): probes along the intended velocity's direction (0x1A4CD0) and, against a surface steeper than 50° or of material 8 or 12, removes the velocity's part into it. The probe starts 0.395 u up and reaches 0.5 u (and 1.4 × that from 0.3 × the height); under water (types 17, 18) it starts at the origin and reaches 0.7 u. Seen on 240 underwater frames of the sewer traces: the intended velocity was the swim's own less its part into the channel's wall."

# 2026-10-13, changing level (docs/re-setup.md, "Going straight to a level"). Writing a
# level number to level_next and 1 to level_change_request in a running game loads that
# level, checked headlessly (tools/pine-probe/warp.sh).

[[symbol]]
name = "level_current"
address = 0x001D545C
kind = "data"
confidence = "high"
note = "The level being played: 1 Veldin, 2 Florana (seen after a warp). The level list is in docs/re-setup.md."

[[symbol]]
name = "level_next"
address = 0x001DFBC4
kind = "data"
confidence = "high"
note = "The level the next change loads; -1 leaves for the menus. Other code reuses the word during play, so write it just before the request."

[[symbol]]
name = "level_change_request"
address = 0x001D6674
kind = "data"
confidence = "high"
note = "Non-zero makes main_loop save the level's state and call level_change. Set by request_level_change."

[[symbol]]
name = "game_mode"
address = 0x001D6694
kind = "data"
confidence = "medium"
note = "libuya's GameMode: 0 normal play, 2 a scene (arrival cutscenes), 6 set while a level change starts."

[[symbol]]
name = "main_loop"
address = 0x003EE988
kind = "function"
confidence = "medium"
note = "The per-frame game loop; each frame it first checks level_change_request."

[[symbol]]
name = "request_level_change"
address = 0x00417DA0
kind = "function"
confidence = "high"
note = "(level, save): maps some levels (13 to 23 before a story flag, 3 to 6 in one mode), then sets level_next and level_change_request, and with save records the save slot's level."

[[symbol]]
name = "level_change"
address = 0x004AC828
kind = "function"
confidence = "medium"
note = "Tears the level down and calls level_switch; on a negative level_next it goes back to the menus."

[[symbol]]
name = "level_switch"
address = 0x004D3E20
kind = "function"
confidence = "medium"
note = "Loads level_next through level_load and runs its transition until it finishes."

[[symbol]]
name = "level_load"
address = 0x004D3998
kind = "function"
confidence = "medium"
note = "Picks the transition for (current, next) from level_transitions, sets level_current, and starts loading the level's files."

[[symbol]]
name = "level_transitions"
address = 0x002F3E58
kind = "data"
confidence = "medium"
note = "51 entries of 16 bytes: from level (-1 for any), to level, handler index into 0x2F3D80 (0x18 bytes each), two arguments. Any level to a planet (1-14, 16-19, 21-24) uses handler 6, the flight in."

