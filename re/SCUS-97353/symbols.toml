# 2026-10-15, armor numbers, skins, multiplayer skins and the ship's paint
# (docs/research/moby-format.md, "Armor numbers and names", "Multiplayer skins" and "The
# third slot: the ship's paint"). Code and its data from Veldin's build: the vendor code and
# tables are level code and data (the skin table is at 0x2F1160 on the Phoenix).

[[symbol]]
name = "armor_worn"
address = 0x001426A0
kind = "data"
confidence = "high"
note = "Short, saved: the armor number worn (the armor WAD entry, 0-4). Inferno Mode sets it to 4 for a while."

[[symbol]]
name = "armor_kept"
address = 0x001426D8
kind = "data"
confidence = "medium"
note = "The armor bought, which armor_worn returns to when Inferno Mode ends; armor_change tints the hero moby (byte +0x7E) by it when it is 1-3."

[[symbol]]
name = "skin_worn"
address = 0x001427AB
kind = "data"
confidence = "high"
note = "Byte, saved: the skin worn as an armor WAD entry (5-13), 0 for none. armor_load and armor_install use it in place of the armor number."

[[symbol]]
name = "skin_get"
address = 0x00510800
kind = "function"
confidence = "high"
note = "Returns skin_worn."

[[symbol]]
name = "skin_set"
address = 0x005107D0
kind = "function"
confidence = "high"
note = "(entry): sets skin_worn; -1 means none (0)."

[[symbol]]
name = "skin_unlocked"
address = 0x004B7370
kind = "function"
confidence = "medium"
note = "(entry): the entry's unlocked bit, in 0x14271E for entries 0-7 and 0x1427A8 for 8-15. Also used for the armors the vendor offers."

[[symbol]]
name = "skin_unlock"
address = 0x004B72F8
kind = "function"
confidence = "medium"
note = "(entry): sets the entry's unlocked bit (see skin_unlocked)."

[[symbol]]
name = "armor_names"
address = 0x001DACA0
kind = "data"
confidence = "high"
note = "Five text numbers, the names of armors 0-4 (0x13EC-0x13F0: Alpha Combat Suit, Magnaplate Armor, Adamantine Armor, Aegis Mark V Armor, Infernox Armor)."

[[symbol]]
name = "armor_prices"
address = 0x001DACB8
kind = "data"
confidence = "high"
note = "Five prices in bolts for armors 0-4: 0, 10,000, 60,000, 250,000, 1,000,000."

[[symbol]]
name = "skin_table"
address = 0x002F1C60
kind = "data"
confidence = "high"
note = "Ten 16-byte records of the Specials menu's skins: name text, description text, price in titanium bolts (0xFF hidden), armor WAD entry (-1 for the armor worn, then 5-13)."

[[symbol]]
name = "armor_hero_blocks"
address = 0x002F1480
kind = "data"
confidence = "medium"
note = "Per armor number 0-13, {address, size} of a block armor_install copies into the hero class just before its skeleton (the header's byte 0x0F counts its quadwords). Joint-tied records with offsets and radii; what they are for isn't known."

[[symbol]]
