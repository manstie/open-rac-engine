[[symbol]]
name = "skin_buy"
address = 0x004B9170
kind = "function"
confidence = "medium"
note = "Buying a skin with titanium bolts (0x44F480 counts those left, at most 40; 0x44F428 spends them), then skin_set and armor_change."

[[symbol]]
