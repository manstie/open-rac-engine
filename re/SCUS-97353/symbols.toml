kind = "function"
confidence = "high"
note = "Fills the vendor's list with the armors numbered above the one worn, with armor_prices."

[[symbol]]
name = "skin_list"
address = 0x004B75A8
kind = "function"
confidence = "high"
note = "Fills the vendor's list from skin_table, showing a skin already unlocked at price 0."

[[symbol]]
name = "vendor_open"
address = 0x004B7948
kind = "function"
confidence = "medium"
note = "(kind): opens a vendor; its mode at 0x244790 is 0 weapons, 2 Ship Upgrades, 3 armor, 5 skins. The list is at 0x244880, 16 bytes per item (the armor or skin entry at +8)."

[[symbol]]
name = "vendor_preview"
address = 0x004BBDD8
kind = "function"
confidence = "medium"
note = "Shows the selected item: for armor and skins, armor_change to it; for Ship Upgrades, ship_load and texture_slot_load from the chosen configuration."

[[symbol]]
name = "vendor_close"
