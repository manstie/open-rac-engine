# Ratchet & Clank: Up Your Arsenal (NTSC-U, SCUS-97353): named addresses. Format:
# re/README.md. Found 2026-10-12 by static analysis in Ghidra of a savestate taken
# headlessly (docs/re-setup.md, "NTSC savestates without a capture session"), by matching
# each function to its R&C3 PAL counterpart (PLAN.md RE.2, RE.3, RE.8).

release = "SCUS-97353"
image = "Veldin, a new game just after the opening cutscene (headless boot, 2026-10-12)"
notes = """
Code addresses are inside Veldin's level overlay, so they only hold for this level. The
hero's data is at the same addresses as in R&C3 PAL (see re/SCES-52456/symbols.toml), and
$gp is the same 0x1DC8B0. Three self-made traces (scripted keyboard play, 2026-10-12) check
the jump code; see docs/research/hero-controller.md.
"""

[[symbol]]
name = "hero_update"
address = 0x004EA708
kind = "function"
confidence = "medium"
note = "Per-frame hero entry, the counterpart of R&C3 PAL's: same stick copy, the same 0.25 d-pad fallback, then hero_update_state."

[[symbol]]
name = "hero_update_state"
address = 0x004F2090
kind = "function"
confidence = "medium"
note = "Switch on the hero state; counterpart of R&C3 PAL's, with constants folded for 60 Hz."

[[symbol]]
name = "hero_change_state"
address = 0x004FC518
kind = "function"
confidence = "high"
note = "Fills the jump block on entering jump-type states. Same heights as PAL; per-frame values folded for 60 Hz (gravity 0.00825 = 29.7/3600) and frame counts scaled by about 6/5 (standing-jump hold 17 frames). The values it writes match the UYA traces."

[[symbol]]
name = "hero_jump_vertical"
address = 0x004ED860
kind = "function"
confidence = "high"
note = "Vertical motion of jump-type states, the same algorithm as R&C3 PAL's; double-jump cap 7/60*1.25 u/frame, step 0.041667, for 8 frames. Reproduces the UYA traces (standing, long, flip, heli and double jumps)."

[[symbol]]
name = "walk_speed"
address = 0x001DBE58
kind = "data"
confidence = "high"
note = "6.17 world units per second, as on PAL (where it is at 0x1DBE18). Walking at 0.102833 per frame in the traces."

[[symbol]]
name = "jump_override_table"
address = 0x001DBD30
kind = "data"
confidence = "low"
note = "The level-0 jump override (min/max height, gravity per second squared), as on PAL at 0x1DBCF0."

[[symbol]]
name = "hero_walk_turn"
address = 0x004EB0E8
kind = "function"
confidence = "medium"
note = "Walk turn spring while setting off: gain clamp(0.02 m, 0.01, 0.022), damping 0.27, cap clamp(0.064 m, 0.032, 0.0931); 0.035 and 0.1949 while skidding. The R&C3 PAL counterpart is checked in its traces."

# Added 2026-10-12 while reading the wall jump, ledges, hits and slope limit (RE.3). Found
# by decompiling the callers of hero_change_state and the readers and writers of the hero
# fields below (tools/ghidra/RefsTo.java). Not yet checked in a trace.

[[symbol]]
name = "hero_tick"
address = 0x004DE348
kind = "function"
confidence = "medium"
note = "The hero's per-frame driver in normal play: hero_update, the floor-material check, hero_detect_ledge into the ledge block, then hero_transitions and the collision and animation updates."

[[symbol]]
name = "hero_transitions"
address = 0x00503B68
kind = "function"
confidence = "medium"
note = "Switch on the hero state that picks the next state from input and the detectors: jumps, wall jump (needs the wall window and X within 7 frames), ledge grab (when the ledge block's found flag is set), ledge controls, get-hit recovery."

[[symbol]]
name = "hero_detect_wall"
address = 0x004E39B8
kind = "function"
confidence = "medium"
note = "Sets the 6-frame wall window: probes along the facing at 3.0 u (1.7 in a wall jump) and 0.2 u above the feet, wall steeper than 75 degrees facing the hero within 50 degrees, at most 0.72 u (0.95) from the axis. Material 15 marks wall-jump surfaces."

[[symbol]]
name = "hero_detect_ledge"
address = 0x004E4550
kind = "function"
confidence = "medium"
note = "Ledge search at a given point: flat top (under 20 degrees) 0.5-1.5 u above the feet and 1.8 u above the ground, clear lip, wall face below; writes hang point (lip + 0.5 out, 1.43 down), lip and wall yaw to the block passed in. Returns 1 when found."

[[symbol]]
name = "hero_air_horizontal"
address = 0x004EDE80
kind = "function"
confidence = "medium"
note = "Horizontal motion of jump-type states after push-off: air control, plus each move's own rule (long jump keeps its velocity, wall jump 4.9 u/s along the wall normal, ledge jump's animation-timed forward speed)."

[[symbol]]
name = "hero_ground_probe"
address = 0x004EBA68
kind = "function"
confidence = "medium"
note = "Casts down for the ground; the hero stands when within 0.02 u of it and the slope is at most 0.8727 rad (50 degrees). Writes the height above ground and the slope angle."

[[symbol]]
name = "hero_floor_material"
address = 0x004E3EF0
kind = "function"
confidence = "medium"
note = "Reacts to the ground's collision material: 1 lava, 3 water, 4 slide, 11 and 17 (damage, state 177) and others."

[[symbol]]
name = "hero_crouch_jump"
address = 0x00502ED8
kind = "function"
confidence = "medium"
note = "X from a crouch at least 7 frames old: long jump (10) with the stick past 0.7 and speed above 0.9 u/s, otherwise the heli jump (15); with the thruster-pack item, states 16 and 13."

[[symbol]]
name = "hero_frame_timers"
address = 0x004FAA68
kind = "function"
confidence = "medium"
note = "Per-frame bookkeeping: increments the state timer at 0x1A4D98 and counts down the hero's short timers, among them the wall window (0x1A4DB4) and the no-grab timer (0x1A4DB0)."

[[symbol]]
name = "pad_pressed_within"
address = 0x0045D358
kind = "function"
confidence = "high"
note = "Whether any of a button mask was pressed in the last n frames, from a 30-entry history of each pad; optionally returns how many frames ago."

[[symbol]]
name = "pad_button_for"
address = 0x0045E3B8
kind = "function"
confidence = "medium"
note = "Maps a default button mask to the configured one: with the alternate control setup, R1 (8) becomes R2, L1 (4) becomes L2, and X (0x40) also accepts L1."

[[symbol]]
name = "hero_ledge_block"
address = 0x001A50E0
kind = "data"
confidence = "medium"
note = "hero_detect_ledge's result for the hero: +0x00 hang point, +0x10 lip point, +0x24 wall yaw, +0x28 found flag, +0x34 flags (bit 0: room above the lip), +0x38 the object grabbed."

[[symbol]]
name = "hero_wall_window"
address = 0x001A4DB4
kind = "data"
confidence = "medium"
note = "Wall-contact countdown: 6 (7 in a wall jump) while a wall is in reach, counted down each frame."

[[symbol]]
name = "hero_wall_normal"
address = 0x001A5090
kind = "data"
confidence = "medium"
note = "The wall normal found by hero_detect_wall; its yaw is at +0xC. A wall jump copies both to 0x1A50A0 and 0x1A50AC to compare with the next wall."

[[symbol]]
name = "hero_height_above_ground"
address = 0x001A4F1C
kind = "data"
confidence = "medium"
note = "Written by hero_ground_probe: distance down to the ground, 32 when none was found."

[[symbol]]
name = "hero_ground_slope"
address = 0x001A4F20
kind = "data"
confidence = "medium"
note = "Written by hero_ground_probe: the ground's angle from the horizontal, in radians."

[[symbol]]
name = "hero_health"
address = 0x001A7430
kind = "data"
confidence = "medium"
note = "Below 1, idle, walk and get-hit recovery go to the death state (57)."

[[symbol]]
name = "hero_stick_magnitude"
address = 0x001A7418
kind = "data"
confidence = "medium"
note = "The stick magnitude m (0..1) the transitions compare with 0.5, 0.7 and 0.85."

[[symbol]]
name = "hero_anim_frame"
address = 0x001A57F8
kind = "data"
confidence = "low"
note = "The current animation's frame, as a float; the ledge and get-hit transitions and the ledge jump's forward speed are timed by it."

# Added 2026-10-12 while reading the follow camera (RE.4); checked against the trace
# uyantsc-veldin-cam-1 where docs/research/camera.md says so.

[[symbol]]
name = "camera_mode_table"
address = 0x002F7700
kind = "data"
confidence = "medium"
note = "Camera modes: entries of a mode number and four functions (mode 0: 0x3E8810, init 0x3E52D0, update 0x3E8850, 0x3E8B20), ended by -1."

[[symbol]]
name = "camera_follow_update"
address = 0x003E8850
kind = "function"
confidence = "high"
note = "Mode 0 (normal follow) per-frame update: sets the orbit speed from the camera-speed option, then calls the platform ride, parameter, motion, arm and end-of-frame functions below."

[[symbol]]
name = "camera_follow_init"
address = 0x003E52D0
kind = "function"
confidence = "medium"
note = "Mode 0 init: distance 4.64, height 2.0, look height 1.5, spring gains, and the arm from the camera's position."

[[symbol]]
name = "camera_follow_params"
address = 0x003E42C0
kind = "function"
confidence = "medium"
note = "Per-frame overrides of the follow parameters by hero state and camera volumes; holds the sharp-turn recentring, disabled by the global at 0x1DF6C4."

[[symbol]]
name = "camera_follow_motion"
address = 0x003E39E0
kind = "function"
confidence = "medium"
note = "Springs the look point towards the follow point (gain 0.015 / 0.0125, damping 0.2), sets the aim point and the vertical clearance."

[[symbol]]
name = "camera_arm_drag"
address = 0x003E7A70
kind = "function"
confidence = "high"
note = "The drag: arm = lerp(arm, last camera position - pivot, 0.85), then its length set to the follow distance less the pull-in. Verified against the trace."

[[symbol]]
name = "camera_manual_input"
address = 0x003E7668
kind = "function"
confidence = "medium"
note = "Right stick: yaw at the orbit speed, and a tilt target of up to 40 degrees past a 0.3 dead zone, reached at most 0.0305 rad a frame."

[[symbol]]
name = "camera_obstacles"
address = 0x003E64E0
kind = "function"
confidence = "low"
note = "Pull-in, nudges away from some object classes, and the reset after 30 blocked frames."

[[symbol]]
name = "camera_place"
address = 0x003E82F8
kind = "function"
confidence = "high"
note = "The actual arm chases the dragged one (yaw and tilt springs 0.015 / 0.2, length spring from 0x3E80A8); camera = look point + height + actual arm, pushed out with a 0.25 sphere."

[[symbol]]
name = "camera_approach_distance"
address = 0x003E80A8
kind = "function"
confidence = "medium"
note = "Hero moving against the camera's facing (dot < -0.3): distance target up to 6.0 by speed (full at 0.07 u/frame), and a stiffer arm-length spring."

[[symbol]]
name = "camera_end_of_frame"
address = 0x003E4008
kind = "function"
confidence = "high"
note = "Springs the distance (gain 0.003, damping 0.2), height and look height to their targets and resets the per-frame overrides. The distance spring is verified against the trace."

[[symbol]]
name = "camera_volumes_update"
address = 0x003F09E0
kind = "function"
confidence = "medium"
note = "Picks the active camera volume of 32 slots at 0x1E5D10 (0x40 bytes each) and applies its overrides."

[[symbol]]
name = "camera_spring"
address = 0x003F13A8
kind = "function"
confidence = "high"
note = "Scalar damped spring: rate += gain * error - damping * rate, optional cap, no overshoot."

[[symbol]]
name = "camera_angle_spring"
address = 0x003F1438
kind = "function"
confidence = "high"
note = "The angle version of camera_spring."

[[symbol]]
name = "camera0_update_object"
address = 0x001E31B0
kind = "data"
confidence = "high"
note = "Camera 0's update object (pointed to by 0x1E2B10): +0x30 the camera position, +0x70 the follow block, +0x94 the camera index."

[[symbol]]
name = "camera0_follow_block"
address = 0x001E5590
kind = "data"
confidence = "high"
note = "Follow block: +0x60 follow point, +0xA0 aim point, +0xC0 look point, +0x130 look height, +0x180 dragged arm, +0x190 actual arm, +0x1AC distance, +0x1B0 height, +0x240 pull-in."

[[symbol]]
name = "camera_active_volume"
address = 0x001DF980
kind = "data"
confidence = "medium"
note = "Camera 0's active volume index, -1 for none."

# 2026-10-12, the walk's skid and the moves that need items (PLAN.md RE.3).

[[symbol]]
name = "pad_update"
address = 0x0045D5C8
kind = "function"
confidence = "medium"
note = "Per-frame pad update: the dead zone, the button edges, and a 30-frame ring of button presses (+0x1E0), stick lengths (+0x2D0) and stick angles (+0x258)."

[[symbol]]
name = "pad_stick_angle_back"
address = 0x0045D488
kind = "function"
confidence = "medium"
note = "The left stick's angle n frames back in the pad's ring (1 is this frame). The walk compares 1 and 7 to spot a stick swung round."

[[symbol]]
name = "atan2"
address = 0x0040C490
kind = "function"
confidence = "medium"
note = "Polynomial atan2(y, x) with an octant table at 0x1D9D40; 0 for (0, 0)."

[[symbol]]
name = "angle_between"
address = 0x0040CFB0
kind = "function"
confidence = "medium"
note = "Absolute difference of two angles, the short way round."

[[symbol]]
name = "hero_walk_stick_target"
address = 0x004EADD0
kind = "function"
confidence = "medium"
note = "The walk's stick direction, its angle from the facing, and the target speed walk_speed × stick magnitude."

[[symbol]]
name = "hero_speed_towards_target"
address = 0x004EB350
kind = "function"
confidence = "medium"
note = "Moves the speed towards the target by the first argument when rising, the second when falling."

[[symbol]]
name = "hero_velocity_along"
address = 0x004EB3A0
kind = "function"
confidence = "medium"
note = "Sets the intended velocity from the speed along a yaw: the facing when given more than π, else the stick's direction while the walk slides."

[[symbol]]
name = "walk_substate_speeds"
address = 0x001DBE40
kind = "data"
confidence = "medium"
note = "Per walk substate, 16 bytes: the speeds below and above which the animation code changes substate (setting off 0-2.35 u/s, moving 1.9-10)."

[[symbol]]
name = "hero_item_in_slot"
address = 0x004E5470
kind = "function"
confidence = "medium"
note = "The item in an item slot when it is equipped, else -1. Slot 3 is the back: 2 the heli-pack, 3 the thruster-pack."

[[symbol]]
name = "hero_skid_exit"
address = 0x00503310
kind = "function"
confidence = "low"
note = "Called from the skid state's transitions; picks an idle animation for the hand item when the skid ends."
