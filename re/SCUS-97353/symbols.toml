[[symbol]]
name = "hero_mesh_swap"
address = 0x00422C60
kind = "function"
confidence = "medium"
note = "(on): Inferno Mode's look. On, gives the hero class the packet table and counts of class 0x1F3A; off, re-attaches the armor (armor_attach)."

[[symbol]]
name = "crate_break"
address = 0x0033BE30
kind = "function"
confidence = "low"
note = "Breaking a crate (classes 0x1F4, 0x1F5, 0x1F8, 0x1FF, 0x200). For the Inferno crate (0x1F8) it starts Inferno Mode: armor_worn 4 for 1,200 frames (0x1A4E14 counts down) and hero_mesh_swap."

