# Ratchet & Clank: Up Your Arsenal (NTSC-U, SCUS-97353): where the hero lives in EE memory.
# Format and verification conventions: re/README.md. The hero's data addresses are the same
# as R&C3 PAL's (re/SCES-52456/hero.toml); checked 2026-10-12 against a headless Veldin
# savestate and self-made traces (PLAN.md RE.2, RE.3, RE.8).

release = "SCUS-97353"
title = "Ratchet & Clank: Up Your Arsenal (USA)"
refresh_hz = 60
frame_counter = 0x0015BC80
notes = """
Same layout and addresses as R&C3 PAL: the hero struct, $gp (0x1DC8B0) and the pad
struct all match, and the hero code reads the same globals (re/SCUS-97353/symbols.toml).
Field notes below were written for R&C3 PAL; the per-frame values they quote are PAL's,
and UYA's are the 60 Hz forms (docs/research/hero-controller.md).

frame_counter: the same address as R&C3 PAL. During gameplay it advanced exactly as the
hero's state timer between two savestates (76 frames), and three captures of 1,075-2,069
frames had no gaps. At the title screen it counts faster, so capture only in gameplay.
"""

[[region]]
name = "hero"
base = 0x001A4BC0
size = 0x2940

[[field]]
name = "pos"
region = "hero"
offset = 0xA0
type = "vec3"
key = true
note = "Hero position in world units. Programie/RCMemory reports 0x1A4C60; verified: it follows Ratchet in every savestate and is the running sum of `vel`."

[[field]]
name = "rot"
region = "hero"
offset = 0xB0
type = "vec3"
note = "Roll, pitch, yaw in radians (layout as libuya's Hero). Yaw changes as Ratchet turns; roll and pitch not checked."

[[field]]
name = "vel"
region = "hero"
offset = 0x130
type = "vec3"
key = true
note = "Actual displacement per frame: equals pos[n] - pos[n-1] exactly on all 1,803 frames of the rc3pal-veldin-5 replay."

[[field]]
name = "state"
region = "hero"
offset = 0x25E4
type = "i32"
key = true
note = "Hero state, numbered as libuya's PlayerState enum. Verified: 24 (ledge idle) in the ledge savestate, and walk/jump/run-jump/double-jump/attack transitions line up with the recorded inputs."

[[field]]
name = "substate"
region = "hero"
offset = 0x25E8
type = "i32"
note = "Position matches libdl's PlayerSubstate relative to the state; meaning not checked."

[[field]]
name = "state_type"
region = "hero"
offset = 0x25EC
type = "i32"
note = "State category, numbered as libuya's PlayerType. Verified pairs: walk=1, crouch=12, all jump states=4, attacks=6, ledge=3."

[[field]]
name = "prev_state"
region = "hero"
offset = 0x25F0
type = "i32"
note = "Previous state: equal to the old state at all 54 transitions in the rc3pal-veldin-5 replay."

[[field]]
name = "intended_vel"
region = "hero"
offset = 0x110
type = "vec3"
note = "Velocity the state code asks for (code base +0xF0); collision turns it into vel. On the ground it holds a -0.0216 downward push; at a standing jump's take-off it is 0.16407. Checked in the rc3pal-veldin-5 trace."

[[field]]
name = "speed_target"
region = "hero"
offset = 0x1D0
type = "f32"
note = "Ground speed the stick asks for: 6.17 * 0.02 * stick_mag while walking. Checked in both traces."

[[field]]
name = "speed"
region = "hero"
offset = 0x1D4
type = "f32"
note = "Current ground speed; steps towards speed_target by 0.0148 per frame when speeding up. Checked in both traces."

[[field]]
name = "state_timer"
region = "hero"
offset = 0x1D8
type = "i32"
note = "Frames since the current state began; hero_change_state resets it. Checked in both traces."

[[field]]
name = "jump_apex_gravity"
region = "hero"
offset = 0x448
type = "f32"
note = "Gravity after the apex: jump_gravity * 1.17 for a standing jump (0.0139), 0 when unchanged. Copied into jump_gravity at the apex in the traces."

[[field]]
name = "jump_max_fall"
region = "hero"
offset = 0x490
type = "f32"
note = "Fall speed cap per frame (1.0000001, i.e. 50 units/s). Value read in the traces; the cap was not reached."

[[field]]
name = "jump_air_max"
region = "hero"
offset = 0x494
type = "f32"
note = "Horizontal speed cap for air control (0.1234 per frame for a standing jump on PAL). Checked with air control in the traces."

[[field]]
name = "jump_height"
region = "hero"
offset = 0x498
type = "f32"
note = "Target jump height: starts at jump_min_height and grows by (max - min) / jump_up_frames each frame X is held. Checked frame by frame in the traces."

[[field]]
name = "jump_push_frames"
region = "hero"
offset = 0x49C
type = "i16"
note = "Push-off frames before the jump impulse applies (1 for a standing jump). Checked in the traces."

[[field]]
name = "jump_pending"
region = "hero"
offset = 0x4A0
type = "f32"
note = "Upward speed still to add: sqrt(2 * jump_height * jump_gravity) minus jump_given. Checked frame by frame in the traces."

[[field]]
name = "jump_given"
region = "hero"
offset = 0x4A4
type = "f32"
note = "Upward speed added so far. Checked frame by frame in the traces."

[[field]]
name = "jump_past_apex"
region = "hero"
offset = 0x48E
type = "u8"
note = "Set once the vertical speed drops below 0.001 after push-off. Checked in the traces."

[[field]]
name = "jump_air_accel"
region = "hero"
offset = 0x4F0
type = "f32"
note = "Acceleration of the ground speed towards the air cap during push-off (0.008 per frame on PAL = 20 units/s^2). Air control has its own constant of the same size. Read in the traces."

[[field]]
name = "jump_air_decel"
region = "hero"
offset = 0x4F4
type = "f32"
note = "Braking of the ground speed during push-off (0.0044 per frame on PAL = 11 units/s^2). Read in the traces."

[[field]]
name = "jump_min_height"
region = "hero"
offset = 0x4F8
type = "f32"
note = "Height of a tapped jump (1.42 for a standing jump). Read in the traces."

[[field]]
name = "jump_max_height"
region = "hero"
offset = 0x4FC
type = "f32"
note = "Height of a fully held jump (2.7 for a standing jump). Read in the traces."

[[field]]
name = "jump_up_frames"
region = "hero"
offset = 0x508
type = "i16"
note = "Frames X can extend the jump (14 for a standing jump on PAL). Read in the traces."

[[field]]
name = "jump_gravity"
region = "hero"
offset = 0x510
type = "f32"
note = "Gravity per frame (0.01188 = 29.7 units/s^2 for a standing jump). Checked frame by frame in the traces."

[[field]]
name = "stick_x"
region = "hero"
offset = 0x2280
type = "f32"
note = "Left stick x after the pad's dead zone, as the hero sees it. Matches the recorded stick bytes on 3,150 of 3,183 frames; the rest are zeroed by the 0.25 cut-off or by scripted states."

[[field]]
name = "stick_y"
region = "hero"
offset = 0x2284
type = "f32"
note = "Left stick y (forward positive), as stick_x."

[[field]]
name = "stick_mag"
region = "hero"
offset = 0x2858
type = "f32"
note = "(max(|x|,|y|) + length) / 2 of the stick, clamped to 1. Checked in both traces."

[[field]]
name = "move_angle"
region = "hero"
offset = 0x1C0
type = "f32"
note = "Yaw the hero wants to face and move towards (radians): the stick direction rotated by the camera yaw. Checked with the turn spring in the traces."

[[field]]
name = "yaw_rate"
region = "hero"
offset = 0x1C4
type = "f32"
note = "Yaw change per frame from the turn spring (docs/research/hero-controller.md, Turning). Reproduced on all 724 non-strafe walking frames of the R&C3 traces."

[[field]]
name = "skid"
region = "hero"
offset = 0x40F
type = "u8"
note = "Skid flag of the walk state: set by a sharp turn or by releasing the stick; selects the skid braking and turn values. Checked in the traces."

[[field]]
name = "jump_air_turn_cap"
region = "hero"
offset = 0x484
type = "f32"
note = "Turn-rate cap in the air (15 rad/s: 0.3002 per frame on PAL, 0.25016 on UYA NTSC). Read in the traces."

[[region]]
name = "pad"
base = 0x001CD0C0
size = 0x1B0

[[field]]
name = "pad_buttons"
region = "pad"
offset = 0x2
type = "u16"
note = "Raw DualShock button bits, active low (0xFFFF with nothing pressed)."

[[field]]
name = "pad_lx"
region = "pad"
offset = 0x6
type = "u8"
note = "Raw left stick x byte (0-255, centre about 127)."

[[field]]
name = "pad_ly"
region = "pad"
offset = 0x7
type = "u8"
note = "Raw left stick y byte (0-255, up is 0)."

[[field]]
name = "pad_held"
region = "pad"
offset = 0x1A0
type = "u32"
note = "Held-button mask the hero code tests (the jump test uses bit 0x40)."
