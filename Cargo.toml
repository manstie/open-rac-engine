[workspace]
resolver = "3"
# `tools/*` holds reverse-engineering tools (PLAN.md track RE); they never ship.
members = ["crates/*", "tools/*"]
# Ghidra scripts (Java), not a crate.
exclude = ["tools/ghidra"]
# `cargo run` at the repository root launches the game.
default-members = ["crates/openrac"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/manstie/open-rac-engine"

[workspace.dependencies]
anyhow = "1"
# Default features are off so the hero kit's crates can ask for only what they use and
# stay reusable in other Bevy apps; `openrac` turns the defaults back on.
bevy = { version = "0.20", default-features = false }
directories = "6"
# Collision queries for the hero kit. `alloc` enables casting between convex shapes. Never
# enable `enhanced-determinism`: it turns on glam's `scalar-math` for the whole build,
# which shrinks `Vec4` to 4-byte alignment and breaks Bevy's GPU mesh buffers (PLAN.md
# section 5, 2026-10-13).
parry3d = { version = "0.31", default-features = false, features = ["required-features", "std", "alloc"] }
# Never used in code: its `libm` feature sends parry's scalar maths (through simba) to
# libm rather than each platform's C library, the half of `enhanced-determinism` we keep.
glamx = { version = "0.3", default-features = false, features = ["libm"] }
rac_combat = { path = "crates/rac_combat" }
rac_demo = { path = "crates/rac_demo" }
rac_formats = { path = "crates/rac_formats" }
rac_hero = { path = "crates/rac_hero" }
rac_input = { path = "crates/rac_input" }
rac_iso = { path = "crates/rac_iso" }
rac_rig = { path = "crates/rac_rig" }
rac_sim = { path = "crates/rac_sim" }
clap = { version = "4", features = ["derive"] }
ruzstd = "0.8"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[workspace.lints.clippy]
# Bevy systems routinely take many parameters and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"

# Bevy's recommended development profile: fully optimise dependencies and lightly
# optimise our own code so debug builds stay playable without slow rebuilds.
# Line tables only: panics and backtraces keep file and line, while links of the Bevy test
# binaries need a fraction of the memory (full debug info froze a 31 GB machine when
# linking them in parallel). Set `debug = true` locally to inspect variables in a debugger.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
