[package]
name = "rac_net"
description = "Hero kit: direct-IP co-op sessions over ggrs, with rollback and desync checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log"] }
bincode.workspace = true
ggrs.workspace = true
igd-next.workspace = true
rac_input.workspace = true
rac_sim.workspace = true
serde.workspace = true
socket2.workspace = true
thiserror.workspace = true

# The default route's gateway, which PCP and NAT-PMP are asked of (`portmap`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[lints]
workspace = true
