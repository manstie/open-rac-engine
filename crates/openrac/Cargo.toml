[package]
name = "openrac"
description = "Open Ratchet & Clank Engine: the game application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# The workspace turns Bevy's default features off for the kit's crates; the app wants them.
# The system clipboard, for swapping co-op join codes.
bevy = { workspace = true, features = ["default", "serialize", "libm", "system_clipboard"] }
clap.workspace = true
directories.workspace = true
rac_audio.workspace = true
rac_combat.workspace = true
rac_demo.workspace = true
rac_formats.workspace = true
rac_hero.workspace = true
rac_input.workspace = true
rac_iso.workspace = true
rac_net.workspace = true
thiserror.workspace = true
rac_rig.workspace = true
rac_sim.workspace = true
ron.workspace = true
serde.workspace = true
toml.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
# Faster incremental builds while developing: `cargo run --features dev`.
# Never ship a build with this enabled.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true
